[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sayacode"
version = "3.0.0"
description = "A local LangChain and LangGraph coding assistant with a Web UI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "saya-ch"}]
keywords = ["coding-agent", "webui", "langchain", "langgraph", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "langchain[mcp]==1.4.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langmem==0.0.30",
  "langchain-openai==1.6.2",
  "langchain-anthropic==1.7.2",
  "langchain-ollama==1.1.0",
  "langchain-google-genai==4.4.0",
  "aiosqlite==0.22.1",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "ddgs==9.16.0",
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==0.13.0",
  "typesafe-sdk==0.7.0",
  "pywin32==312; sys_platform == 'win32'",
  "psutil==7.2.2; sys_platform == 'win32'",
  "filelock==4.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "pytest-cov==7.1.0",
  "mypy==2.3.0",
  "ruff==0.15.15",
]

[project.scripts]
sayacode = "sayacode.cli.main:main"

[project.urls]
Homepage = "https://github.com/saya-ch/sayacode"
Repository = "https://github.com/saya-ch/sayacode"
Issues = "https://github.com/saya-ch/sayacode/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sayacode"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/sayacode",
  "frontend/src",
  "frontend/index.html",
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/.prettierrc.json",
  "frontend/README.md",
  "frontend/tsconfig.json",
  "frontend/vite.config.ts",
  "docs",
  "assets",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
