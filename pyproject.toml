[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sayacode"
dynamic = ["version"]
description = "SAYACODE CLI coding assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "saya-ch"},
]
keywords = ["coding-agent", "cli", "llm", "developer-tools", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-deepseek>=0.1.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    # Gemini 走官方集成。下限取实际验证过的 4.x。
    "langchain-google-genai>=4.0.0",
    # 多 Agent 调度走 langgraph-supervisor。
    "langgraph-supervisor>=0.0.31",
    # 图状态持久化（thread_id=session_id）。
    "langgraph-checkpoint-sqlite>=3.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "mypy==2.3.0",
    "ruff==0.15.15",
]

# 显式声明与当前默认值等价的 ruff 配置。
# 此前没有本节：lint 行为完全由 pin 住的 ruff 版本决定，升级 pin 会静默改变
# 规则集 —— 可复现，但意图没有被记录。
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.mypy]
python_version = "3.11"
files = [
    "lib/agent.py",
    "lib/cli/headless.py",
    "lib/core",
    "lib/tools",
    "lib/runtime/app.py",
    "lib/runtime/context.py",
    "lib/runtime/events.py",
    "lib/runtime/interactive.py",
    "lib/runtime/launch_config.py",
    "lib/runtime/model_profiles.py",
    "lib/runtime/session_store.py",
    "lib/runtime/startup.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true

[project.scripts]
sayacode = "lib.cli:main"

[project.urls]
Homepage = "https://github.com/saya-ch/sayacode"
Repository = "https://github.com/saya-ch/sayacode"
Issues = "https://github.com/saya-ch/sayacode/issues"

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.setuptools.dynamic]
version = {attr = "lib._version.__version__"}
