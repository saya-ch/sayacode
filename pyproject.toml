[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sayacode"
version = "2.2.0"
description = "A LangChain and LangGraph terminal coding assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "saya-ch"}]
keywords = ["coding-agent", "cli", "langchain", "langgraph", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "langchain[mcp]==1.4.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langmem==0.0.30",
  "langchain-openai==1.6.2",
  "langchain-anthropic==1.7.2",
  "langchain-ollama==1.1.0",
  "langchain-google-genai==4.4.0",
  "aiosqlite==0.22.1",
  "prompt_toolkit==3.0.52",
  "rich==15.0.0",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "ddgs==9.16.0",
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==0.13.0",
  "typesafe-sdk==0.7.0",
  "pywin32==312; sys_platform == 'win32'",
  "filelock==4.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "pytest-cov==7.1.0",
  "mypy==2.3.0",
  "ruff==0.15.15",
]

[project.scripts]
sayacode = "sayacode.cli.main:main"

[project.urls]
Homepage = "https://github.com/saya-ch/sayacode"
Repository = "https://github.com/saya-ch/sayacode"
Issues = "https://github.com/saya-ch/sayacode/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
