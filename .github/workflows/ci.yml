name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Windows 运行器的控制台是 cp1252，而本仓库的脚本与输出含中文。
# 不显式声明编码就会抛 UnicodeEncodeError —— 实测三个 Windows job 因此全挂，
# 而覆盖率校验本身其实是**通过**的，崩溃只发生在打印环节。
env:
  PYTHONIOENCODING: utf-8

jobs:
  release-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run release checks
        run: python scripts/check_release.py

      - name: Run tests with coverage gate
        run: python scripts/check_coverage.py

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type check machine-contract modules with mypy
        if: always()
        run: python -m mypy

  publish:
    needs: release-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
