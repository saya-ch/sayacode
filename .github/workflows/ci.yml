name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # 手动触发：跑不稳定用例检测（连跑多轮，成本高，不进常规流水线）
  workflow_dispatch:

# Windows 运行器的控制台默认编码是 cp1252，而本仓库脚本与输出含中文；
# 不声明编码会抛 UnicodeEncodeError，崩溃点在输出环节而非校验逻辑。
env:
  PYTHONIOENCODING: utf-8

jobs:
  release-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run release checks
        run: python scripts/check_release.py

      - name: Run tests with coverage gate
        run: python scripts/check_coverage.py

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type check machine-contract modules with mypy
        if: always()
        run: python -m mypy

  # 只在手动触发时跑：同一套测试连跑 5 轮，暴露 flaky 用例。
  # 放常规流水线里会让每次 CI 的时间翻五倍，得不偿失。
  flaky-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Detect flaky tests
        run: python scripts/check_flaky.py --runs 5

  # 锁文件可用性检查：requirements-lock.txt 必须装得上且核心包可导入。
  # 只跑单矩阵，验证可安装性，不做逐行严格比对（传递依赖正常漂移不应红）。
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install from lock file
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Import smoke test
        run: python -c "import langchain, langgraph, pydantic, rich; print('lock ok')"

  publish:
    needs: release-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
