name: CI

on:
  push:
    branches: [main]
    tags: ["v2.*"]
  pull_request:

env:
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependency tool
        run: python -m pip install uv==0.12.5
      - name: Install locked SAYACODE and development tools
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Run the 2.x release gate
        run: uv run --no-sync python scripts/check_release.py

  package:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependency tool
        run: python -m pip install uv==0.12.5
      - name: Verify universal lock and create a clean wheel environment
        run: |
          uv lock --check
          uv export --quiet --locked --no-dev --no-emit-project --format requirements.txt --output-file locked-release.txt
          uv venv --python 3.13 wheel-smoke
          uv pip install --python wheel-smoke/bin/python -r locked-release.txt
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.5.0
          python -m build
      - name: Install built wheel and check CLI
        run: |
          uv pip install --python wheel-smoke/bin/python --no-deps dist/sayacode-*.whl
          uv pip check --python wheel-smoke/bin/python
          wheel-smoke/bin/python -m sayacode --version
          wheel-smoke/bin/python -m sayacode --help
      - name: Publish version 2 tag to PyPI
        if: startsWith(github.ref, 'refs/tags/v2.')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
